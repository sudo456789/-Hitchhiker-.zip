<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hitchhiker Scene</title>
<style>
  :root{
    --bg:#0b0d10;
    --screen-bg:#1e1f22;
    --menubar:#0d0d0f;
    --discord-bg:#313338;
    --discord-sidebar:#2b2d31;
    --discord-channel:#1e1f22;
    --discord-msg-hover:#2e3035;
    --text:#f2f3f5;
    --text-dim:#949ba4;
    --accent:#5865f2;
    --green:#23a559;
    --red:#f23f42;
    --finder-bg:#2c2c2e;
    --terminal-bg:#0c0e10;
    --terminal-green:#39ff6a;
    --terminal-dim:#5f6368;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    width:100%;height:100%;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
  }
  body{
    display:flex;align-items:center;justify-content:center;
    height:100dvh;
    min-height:100vh;
    padding: calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px) 12px;
  }

  .laptop{
    width:min(96vw, 980px, calc((100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 1.6));
    aspect-ratio: 16/10;
    background:#111216;
    border-radius: 18px;
    padding: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05) inset;
    position:relative;
  }
  .screen{
    width:100%;height:100%;
    background:var(--screen-bg);
    border-radius: 10px;
    overflow:hidden;
    position:relative;
  }
  .design{
    width:960px;
    height:600px;
    position:absolute;
    top:0;left:0;
    transform-origin: top left;
    display:flex;
    flex-direction:column;
  }

  /* menu bar */
  .menubar{
    height:26px;
    background:var(--menubar);
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 14px;
    font-size:12px;
    color:#cfd0d2;
    flex-shrink:0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .menubar .apple{font-size:13px;opacity:0.9;}
  .menubar .title{font-weight:600;}
  .menubar .spacer{flex:1;}
  .menubar .clock{opacity:0.8; font-variant-numeric: tabular-nums;}

  .stage{
    position:relative;
    flex:1;
    overflow:hidden;
    background: #202225;
  }

  /* ---------- SCENE WRAPPER ---------- */
  .scene{
    position:absolute;
    inset:0;
    opacity:0;
    pointer-events:none;
    transform: scale(0.985);
    transition: opacity .5s ease, transform .5s ease;
  }
  .scene.active{
    opacity:1;
    transform: scale(1);
    pointer-events:auto;
  }

  /* ================= DISCORD ================= */
  .discord{
    display:flex;
    width:100%;height:100%;
    background:var(--discord-bg);
    font-size:14px;
  }
  .d-servers{
    width:56px;background:#1e1f22;
    display:flex;flex-direction:column;align-items:center;
    padding-top:10px;gap:10px;flex-shrink:0;
  }
  .d-servers .pill{
    width:40px;height:40px;border-radius:50%;
    background:#313338;display:flex;align-items:center;justify-content:center;
    color:#949ba4;font-size:11px;font-weight:700;
  }
  .d-servers .pill.on{background:var(--accent);color:#fff;border-radius:14px;}

  .d-sidebar{
    width:188px;background:var(--discord-sidebar);
    flex-shrink:0;
    display:flex;flex-direction:column;
  }
  .d-sidebar .srv-header{
    height:40px;display:flex;align-items:center;padding:0 12px;
    font-weight:700;color:#f2f3f5;font-size:13px;
    border-bottom:1px solid rgba(0,0,0,0.25);
    flex-shrink:0;
  }
  .d-channels{padding:10px 8px;color:var(--text-dim);font-size:13px;}
  .d-channels .ch{
    display:flex;align-items:center;gap:6px;
    padding:6px 8px;border-radius:4px;margin-bottom:2px;
  }
  .d-channels .ch.active{background:var(--discord-msg-hover);color:#fff;}
  .d-channels .ch .hash{opacity:0.6;}

  .d-main{
    flex:1;display:flex;flex-direction:column;min-width:0;
  }
  .d-topbar{
    height:40px;flex-shrink:0;
    border-bottom:1px solid rgba(0,0,0,0.25);
    display:flex;align-items:center;padding:0 14px;
    color:#f2f3f5;font-weight:700;font-size:13px;gap:6px;
  }
  .d-messages{
    flex:1;overflow:hidden;padding:14px 16px;
    display:flex;flex-direction:column;gap:14px;
    justify-content:flex-end;
  }
  .d-msg{display:flex;gap:10px;opacity:0;animation: fadeUp .5s ease forwards;}
  .d-avatar{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;color:#fff;
  }
  .d-msg .body{min-width:0;}
  .d-msg .meta{font-size:13px;margin-bottom:3px;}
  .d-msg .meta .name{font-weight:600;color:#f2f3f5;margin-right:6px;}
  .d-msg .meta .time{font-size:11px;color:var(--text-dim);}
  .d-msg .text{color:#dbdee1;line-height:1.4;}

  .attachment{
    margin-top:6px;
    display:flex;align-items:center;gap:10px;
    background:#2b2d31;
    border:1px solid #3a3c42;
    border-radius:8px;
    padding:10px 12px;
    width:fit-content;
    max-width:320px;
  }
  .attachment .icon{
    width:36px;height:36px;border-radius:6px;
    background:#4a4d53;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;flex-shrink:0;
  }
  .attachment .info{min-width:0;}
  .attachment .fname{color:#fff;font-size:13px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .attachment .fsize{color:var(--text-dim);font-size:11px;}
  .attachment .dl{
    margin-left:auto;color:var(--text-dim);font-size:16px;
    width:28px;height:28px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .attachment.clicked .dl{
    animation: pulseClick .4s ease;
  }
  .attachment.clicked{
    border-color:var(--accent);
  }

  .cursor{
    position:absolute;
    width:18px;height:22px;
    z-index:50;
    pointer-events:none;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
  }

  /* download toast bottom */
  .dl-toast{
    position:absolute;
    bottom:14px;left:50%;
    transform: translateX(-50%) translateY(20px);
    background:#1b1c1e;
    border:1px solid #333;
    border-radius:10px;
    padding:8px 14px;
    display:flex;align-items:center;gap:10px;
    color:#fff;font-size:12px;
    opacity:0;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  .dl-toast .bar{
    width:90px;height:4px;background:#3a3c42;border-radius:2px;overflow:hidden;
  }
  .dl-toast .bar .fill{
    height:100%;width:0%;background:var(--accent);
  }

  /* ================= FINDER ================= */
  .finder{
    width:100%;height:100%;
    background:var(--finder-bg);
    display:flex;flex-direction:column;
  }
  .finder-top{
    height:38px;flex-shrink:0;
    background:#38383a;
    display:flex;align-items:center;gap:8px;padding:0 12px;
    border-bottom:1px solid rgba(0,0,0,0.3);
  }
  .traffic{display:flex;gap:7px;}
  .traffic span{width:11px;height:11px;border-radius:50%;}
  .traffic .r{background:#ff5f57;} .traffic .y{background:#febc2e;} .traffic .g{background:#28c840;}
  .finder-title{color:#e5e5e7;font-size:12.5px;font-weight:600;margin-left:8px;}

  .finder-body{flex:1;display:flex;}
  .finder-side{
    width:150px;background:#2c2c2e;
    border-right:1px solid rgba(255,255,255,0.05);
    padding:10px 8px;color:#9a9a9e;font-size:12px;
  }
  .finder-side .fitem{padding:6px 8px;border-radius:5px;margin-bottom:2px;}
  .finder-side .fitem.active{background:#4a4a4e;color:#fff;}

  .finder-grid{
    flex:1;padding:22px;
    display:flex;gap:28px;flex-wrap:wrap;align-content:flex-start;
  }
  .fobject{
    width:84px;text-align:center;color:#e5e5e7;font-size:11.5px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    opacity:0;
    animation: fadeUp .4s ease forwards;
  }
  .fobject .ficon{
    width:56px;height:56px;
    display:flex;align-items:center;justify-content:center;
    font-size:30px;
    border-radius:10px;
  }
  .fobject.zip .ficon{background:linear-gradient(145deg,#8f949b,#5f636b);}
  .fobject.app .ficon{background:linear-gradient(145deg,#2f3136,#17181a); border:1px solid #444;}
  .fobject .flabel{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:84px;
  }
  .fobject.highlight .ficon{
    box-shadow: 0 0 0 3px var(--accent);
  }

  .unzip-progress{
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    background:rgba(20,20,22,0.95);
    border:1px solid #3a3c42;
    border-radius:12px;
    padding:18px 24px;
    color:#fff;
    width:260px;
    text-align:center;
    opacity:0;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .unzip-progress .ic{font-size:26px;margin-bottom:8px;}
  .unzip-progress .lbl{font-size:12.5px;color:#cfd0d2;margin-bottom:10px;}
  .unzip-progress .ubar{height:5px;background:#3a3c42;border-radius:3px;overflow:hidden;}
  .unzip-progress .ubar .fill{height:100%;width:0%;background:var(--green);}

  /* gatekeeper warning dialog */
  .gk-dialog{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%) scale(0.92);
    width:320px;
    background:#3a3a3c;
    border-radius:12px;
    padding:20px 18px 16px;
    color:#f2f2f2;
    text-align:center;
    opacity:0;
    box-shadow:0 25px 70px rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.08);
  }
  .gk-dialog .gk-icon{font-size:34px;margin-bottom:10px;}
  .gk-dialog .gk-title{font-size:13.5px;font-weight:700;margin-bottom:6px;line-height:1.4;}
  .gk-dialog .gk-sub{font-size:11.5px;color:#c7c7c9;line-height:1.5;margin-bottom:16px;}
  .gk-dialog .gk-btns{display:flex;gap:8px;justify-content:center;}
  .gk-dialog button{
    pointer-events:none;
    border:none;border-radius:6px;
    padding:7px 16px;font-size:12px;font-weight:600;
    background:#55565a;color:#fff;
  }
  .gk-dialog button.primary{background:var(--accent);}

  /* ================= TERMINAL / MINER ================= */
  .termwrap{
    width:100%;height:100%;
    background:var(--terminal-bg);
    display:flex;flex-direction:column;
    font-family: "SF Mono","Menlo",monospace;
  }
  .term-top{
    height:34px;flex-shrink:0;
    background:#17181a;
    display:flex;align-items:center;gap:8px;padding:0 12px;
    border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .term-title{color:#8a8d92;font-size:12px;margin-left:6px;}

  .term-body{
    flex:1;padding:16px 18px;
    color:var(--terminal-green);
    font-size:12.5px;
    line-height:1.65;
    overflow:hidden;
    white-space:pre-wrap;
    position:relative;
  }
  .term-body .dim{color:var(--terminal-dim);}
  .term-body .warn{color:#ffcc66;}
  .term-body .white{color:#e8e8e8;}
  .term-line{opacity:0;animation: fadeIn .25s ease forwards;}

  .miner-panel{
    margin-top:14px;
    border:1px solid #1f2a22;
    border-radius:8px;
    padding:12px 14px;
    background:#0a1210;
    width:min(100%, 480px);
  }
  .miner-row{
    display:flex;justify-content:space-between;
    font-size:12px;margin-bottom:6px;
    color:#c9ffd8;
  }
  .miner-row .k{color:#6fae84;}
  .miner-row .v{font-variant-numeric: tabular-nums; font-weight:700;}
  .pulse-dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--terminal-green);margin-right:6px;
    animation: blink 1.1s ease-in-out infinite;
  }

  /* ---------- keyframes ---------- */
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes fadeIn{
    from{opacity:0;} to{opacity:1;}
  }
  @keyframes blink{
    0%,100%{opacity:1;} 50%{opacity:0.25;}
  }
  @keyframes pulseClick{
    0%{transform:scale(1);} 40%{transform:scale(0.8);} 100%{transform:scale(1);}
  }
  @keyframes cursorMove1{
    0%{ left:20px; top:20px; opacity:0; }
    8%{ opacity:1; }
    35%{ left:300px; top:338px; opacity:1;}
    45%{ left:300px; top:338px; opacity:1;}
    55%{ left:300px; top:338px; opacity:0;}
    100%{ left:300px; top:338px; opacity:0;}
  }

  .hint{
    position:absolute;
    bottom:8px;right:12px;
    font-size:10.5px;color:#5a5d63;
    letter-spacing:0.02em;
    z-index:5;
  }
</style>
</head>
<body>

<div class="laptop">
  <div class="screen" id="screenEl">
  <div class="design" id="designEl">
    <div class="menubar">
      <span class="apple"></span>
      <span class="title" id="menuTitle">Discord</span>
      <span class="spacer"></span>
      <span class="clock" id="clock">11:47 PM</span>
    </div>

    <div class="stage" id="stage">

      <!-- SCENE 1: DISCORD -->
      <div class="scene active" id="scene-discord">
        <div class="discord">
          <div class="d-servers">
            <div class="pill on">C</div>
            <div class="pill">가</div>
            <div class="pill">동</div>
          </div>
          <div class="d-sidebar">
            <div class="srv-header">DREAM</div>
            <div class="d-channels">
              <div class="ch"><span class="hash">#</span> 공지</div>
              <div class="ch active"><span class="hash">#</span> 잡담</div>
              <div class="ch"><span class="hash">#</span> writeup</div>
            </div>
          </div>
          <div class="d-main">
            <div class="d-topbar"><span class="hash">#</span> 잡담</div>
            <div class="d-messages" id="dMessages">
              <div class="d-msg" style="animation-delay:.1s">
                <div class="d-avatar" style="background:#8e44ad;">J2</div>
                <div class="body">
                  <div class="meta"><span class="name">J2</span><span class="time">오늘 오전 1:38</span></div>
                  <div class="attachment" id="attachment">
                    <div class="icon">🗂️</div>
                    <div class="info">
                      <div class="fname">[Hitchhiker].zip</div>
                      <div class="fsize">4.2 MB</div>
                    </div>
                    <div class="dl" id="dlIcon">⬇</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="cursor" id="cursor1" style="left:20px;top:20px;">
          <svg viewBox="0 0 24 28" width="18" height="22"><path d="M1 1 L1 20 L6.5 15.8 L10.2 23.5 L13.3 22 L9.7 14.3 L17 14 Z" fill="white" stroke="black" stroke-width="1"/></svg>
        </div>

        <div class="dl-toast" id="dlToast">
          <span>📥</span>
          <span>Hitchhiker.zip 다운로드 중</span>
          <div class="bar"><div class="fill" id="dlFill"></div></div>
        </div>
      </div>

      <!-- SCENE 2: FINDER / DOWNLOADS -->
      <div class="scene" id="scene-finder">
        <div class="finder">
          <div class="finder-top">
            <div class="traffic"><span class="r"></span><span class="y"></span><span class="g"></span></div>
            <div class="finder-title">다운로드</div>
          </div>
          <div class="finder-body">
            <div class="finder-side">
              <div class="fitem">⭐ 즐겨찾기</div>
              <div class="fitem active">⬇ 다운로드</div>
              <div class="fitem">🖥 바탕화면</div>
              <div class="fitem">📁 문서</div>
            </div>
            <div class="finder-grid" id="finderGrid">
              <div class="fobject zip" id="zipObj" style="animation-delay:.1s">
                <div class="ficon">🗜️</div>
                <div class="flabel">Hitchhiker.zip</div>
              </div>
            </div>
          </div>
        </div>

        <div class="unzip-progress" id="unzipBox">
          <div class="ic">🗜️</div>
          <div class="lbl">Hitchhiker.zip 압축 해제 중…</div>
          <div class="ubar"><div class="fill" id="unzipFill"></div></div>
        </div>

        <div class="gk-dialog" id="gkDialog">
          <div class="gk-icon">⚠️</div>
          <div class="gk-title">"Hitchhiker"은(는) 확인되지 않은<br>개발자가 배포한 앱입니다.</div>
          <div class="gk-sub">이 앱을 열면 Mac과 개인 데이터가<br>손상될 수 있습니다.</div>
          <div class="gk-btns">
            <button>완료</button>
            <button class="primary">그래도 열기</button>
          </div>
        </div>

        <div class="cursor" id="cursor2" style="left:20px;top:20px; opacity:0;">
          <svg viewBox="0 0 24 28" width="18" height="22"><path d="M1 1 L1 20 L6.5 15.8 L10.2 23.5 L13.3 22 L9.7 14.3 L17 14 Z" fill="white" stroke="black" stroke-width="1"/></svg>
        </div>
      </div>

      <!-- SCENE 3: MINER TERMINAL -->
      <div class="scene" id="scene-term">
        <div class="termwrap">
          <div class="term-top">
            <div class="traffic"><span class="r"></span><span class="y"></span><span class="g"></span></div>
            <div class="term-title">Hitchhiker</div>
          </div>
          <div class="term-body" id="termBody"></div>
        </div>
      </div>

    </div>
  </div>
  </div>
</div>

<script>
(function(){
  const screenEl = document.getElementById('screenEl');
  const designEl = document.getElementById('designEl');
  function fitScale(){
    const w = screenEl.clientWidth;
    const h = screenEl.clientHeight;
    const scale = Math.min(w / 960, h / 600);
    designEl.style.transform = `scale(${scale})`;
  }
  function getScale(){
    return screenEl.clientWidth / 960;
  }
  fitScale();
  window.addEventListener('resize', fitScale);
  window.addEventListener('orientationchange', fitScale);
  if(window.ResizeObserver){
    new ResizeObserver(fitScale).observe(screenEl);
  }

  const stage = document.getElementById('stage');
  const sceneDiscord = document.getElementById('scene-discord');
  const sceneFinder = document.getElementById('scene-finder');
  const sceneTerm = document.getElementById('scene-term');
  const menuTitle = document.getElementById('menuTitle');
  const clock = document.getElementById('clock');

  const cursor1 = document.getElementById('cursor1');
  const attachment = document.getElementById('attachment');
  const dlIcon = document.getElementById('dlIcon');
  const dlToast = document.getElementById('dlToast');
  const dlFill = document.getElementById('dlFill');

  const cursor2 = document.getElementById('cursor2');
  const zipObj = document.getElementById('zipObj');
  const finderGrid = document.getElementById('finderGrid');
  const unzipBox = document.getElementById('unzipBox');
  const unzipFill = document.getElementById('unzipFill');
  const gkDialog = document.getElementById('gkDialog');

  const termBody = document.getElementById('termBody');

  function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
  function moveCursor(el, x, y, duration){
    return new Promise(resolve=>{
      el.style.transition = `left ${duration}ms ease, top ${duration}ms ease, opacity .25s ease`;
      el.style.opacity = '1';
      el.style.left = x+'px';
      el.style.top = y+'px';
      setTimeout(resolve, duration);
    });
  }

  function switchScene(el, title){
    document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
    el.classList.add('active');
    if(title) menuTitle.textContent = title;
  }

  function appendTermLine(html, delay){
    const line = document.createElement('div');
    line.className = 'term-line';
    line.innerHTML = html;
    line.style.animationDelay = (delay||0)+'ms';
    termBody.appendChild(line);
    return line;
  }

  const walletBase = 0.00000000;

  async function runMinerTicker(durationMs){
    const panel = document.createElement('div');
    panel.className = 'miner-panel';
    panel.innerHTML = `
      <div class="miner-row"><span class="k"><span class="pulse-dot"></span>status</span><span class="v white">mining</span></div>
      <div class="miner-row"><span class="k">pool</span><span class="v white">xmr-pool.local:443</span></div>
      <div class="miner-row"><span class="k">hashrate</span><span class="v" id="hr">0 H/s</span></div>
      <div class="miner-row"><span class="k">accepted shares</span><span class="v" id="sh">0</span></div>
      <div class="miner-row"><span class="k">wallet (XMR)</span><span class="v" id="wal">0.00000000</span></div>
      <div class="miner-row"><span class="k">cpu usage</span><span class="v warn" id="cpu">0%</span></div>
    `;
    termBody.appendChild(panel);
    await sleep(50);

    const hrEl = panel.querySelector('#hr');
    const shEl = panel.querySelector('#sh');
    const walEl = panel.querySelector('#wal');
    const cpuEl = panel.querySelector('#cpu');

    let wallet = walletBase;
    let shares = 0;
    const start = Date.now();

    return new Promise(resolve=>{
      const iv = setInterval(()=>{
        const t = Date.now()-start;
        const hr = (480 + Math.sin(t/400)*40 + Math.random()*20).toFixed(1);
        hrEl.textContent = hr + ' H/s';
        if(Math.random() > 0.55){
          shares += 1;
          shEl.textContent = shares;
          wallet += 0.00000041 + Math.random()*0.0000006;
          walEl.textContent = wallet.toFixed(8);
        }
        cpuEl.textContent = (78 + Math.sin(t/300)*10).toFixed(0) + '%';
        if(t > durationMs){
          clearInterval(iv);
          resolve();
        }
      }, 220);
    });
  }

  async function playSequence(){
    // reset
    switchScene(sceneDiscord, 'Discord');
    attachment.classList.remove('clicked');
    cursor1.style.transition = 'none';
    cursor1.style.left = '20px';
    cursor1.style.top = '20px';
    cursor1.style.opacity = '0';
    dlToast.style.transition = 'none';
    dlToast.style.opacity = '0';
    dlToast.style.transform = 'translateX(-50%) translateY(20px)';
    dlFill.style.width = '0%';

    cursor2.style.transition = 'none';
    cursor2.style.left = '20px';
    cursor2.style.top = '20px';
    cursor2.style.opacity = '0';
    unzipBox.style.transition = 'none';
    unzipBox.style.opacity = '0';
    unzipFill.style.width = '0%';
    gkDialog.style.transition = 'none';
    gkDialog.style.opacity = '0';
    gkDialog.style.transform = 'translate(-50%,-50%) scale(0.92)';
    const existingApp = document.getElementById('appObj');
    if(existingApp) existingApp.remove();
    termBody.innerHTML = '';

    await sleep(1400);

    // ---- SCENE 1: click attachment ----
    const rect = attachment.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const sc1 = getScale();
    const targetX = (rect.left - stageRect.left)/sc1 + rect.width/sc1 - 26;
    const targetY = (rect.top - stageRect.top)/sc1 + rect.height/sc1/2 - 10;

    await moveCursor(cursor1, targetX, targetY, 900);
    attachment.classList.add('clicked');
    await sleep(300);

    dlToast.style.transition = 'opacity .35s ease, transform .35s ease';
    dlToast.style.opacity = '1';
    dlToast.style.transform = 'translateX(-50%) translateY(0)';
    await sleep(150);
    dlFill.style.transition = 'width 1.1s ease';
    dlFill.style.width = '100%';
    await sleep(1300);
    dlToast.style.transition = 'opacity .35s ease';
    dlToast.style.opacity = '0';
    await sleep(500);

    // ---- SCENE 2: Finder ----
    switchScene(sceneFinder, 'Finder');
    await sleep(500);

    cursor2.style.transition = 'none';
    cursor2.style.left = '20px';
    cursor2.style.top = '40px';
    cursor2.style.opacity = '1';
    await sleep(100);

    const zipRect = zipObj.getBoundingClientRect();
    const fStageRect = stage.getBoundingClientRect();
    const sc2 = getScale();
    const zipX = (zipRect.left - fStageRect.left)/sc2 + zipRect.width/sc2/2 - 9;
    const zipY = (zipRect.top - fStageRect.top)/sc2 + 20;
    await moveCursor(cursor2, zipX, zipY, 850);
    await sleep(150);

    // double click -> unzip
    unzipBox.style.transition = 'opacity .3s ease';
    unzipBox.style.opacity = '1';
    await sleep(150);
    unzipFill.style.transition = 'width 1.3s ease';
    unzipFill.style.width = '100%';
    await sleep(1500);
    unzipBox.style.transition = 'opacity .3s ease';
    unzipBox.style.opacity = '0';
    await sleep(350);

    // app appears
    const appObj = document.createElement('div');
    appObj.className = 'fobject app highlight';
    appObj.id = 'appObj';
    appObj.style.animationDelay = '0s';
    appObj.innerHTML = `<div class="ficon">⚙️</div><div class="flabel">Hitchhiker</div>`;
    finderGrid.appendChild(appObj);
    await sleep(500);

    // move cursor to app, double click
    const appRect = appObj.getBoundingClientRect();
    const sc3 = getScale();
    const appX = (appRect.left - fStageRect.left)/sc3 + appRect.width/sc3/2 - 9;
    const appY = (appRect.top - fStageRect.top)/sc3 + 20;
    await moveCursor(cursor2, appX, appY, 700);
    await sleep(250);

    // gatekeeper dialog
    gkDialog.style.transition = 'opacity .3s ease, transform .3s ease';
    gkDialog.style.opacity = '1';
    gkDialog.style.transform = 'translate(-50%,-50%) scale(1)';
    await sleep(1600);
    gkDialog.style.transition = 'opacity .3s ease, transform .3s ease';
    gkDialog.style.opacity = '0';
    gkDialog.style.transform = 'translate(-50%,-50%) scale(0.95)';
    await sleep(500);

    // ---- SCENE 3: Terminal / miner ----
    switchScene(sceneTerm, 'Hitchhiker');
    termBody.innerHTML = '';
    appendTermLine('<span class="dim">$</span> <span class="white">./Hitchhiker</span>', 0);
    appendTermLine('<span class="dim">Loading runtime…</span>', 350);
    appendTermLine('<span class="dim">Connecting to pool…</span>', 750);
    await sleep(1300);
    appendTermLine('<span class="warn">✓ connected — stratum+tcp://xmr-pool.local:443</span>', 0);
    await sleep(500);
    appendTermLine('<span class="dim">Initializing worker threads (8)…</span>', 0);
    await sleep(700);
    appendTermLine('<span class="white">Mining started.</span>', 0);
    await sleep(400);

    await runMinerTicker(7000);

    await sleep(1800);
  }

  async function loop(){
    while(true){
      await playSequence();
      await sleep(900);
    }
  }

  // clock
  function tick(){
    clock.textContent = '1:46 AM';
  }
  tick();
  setInterval(tick, 1000*20);

  loop();
})();
</script>
